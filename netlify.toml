# Netlify: static app from dist/ plus the Jira proxy as a function on /jira-proxy/*
# (path set in netlify/functions/jira-proxy.ts). Security headers come from public/_headers.
[build]
  command = "yarn build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"

# SPA fallback: client-side routes render index.html. Only applies when no file matches.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Dev Home</title>
    <script>
      // Resolve the theme before first paint so "system"/dark users never see a
      // flash of the wrong theme. Mirrors resolveTheme() in src/hooks/useTheme.ts.
      (function () {
        try {
          var pref = localStorage.getItem("dev-home-theme");
          var resolved =
            pref === "light" || pref === "dark"
              ? pref
              : window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.setAttribute("data-theme", resolved);
        } catch (e) {
          /* localStorage/matchMedia unavailable — fall back to CSS default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
